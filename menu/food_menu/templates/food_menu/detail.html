{% extends 'food_menu/base.html' %}
{% load static %}


{% block title %}{{ food_item.name }}{% endblock %}

{% block content %}
    <h1 class="text-4xl font-bold text-orange-500 items-center">{{ food_item.name }}</h1>
    <p>{{ food_item.description }}</p>
    <p class="price">MWK{{ food_item.price|floatformat:2 }}</p>
{% endblock %}
