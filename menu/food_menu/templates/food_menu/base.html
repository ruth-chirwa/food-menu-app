{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Food Menu</title>
    <!-- <link rel="stylesheet" href="{% static 'food_menu/styles.css' %}"> -->
     <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>

<body class="bg-gray-100">
    <nav>
        <div class="flex justify-between items-center p-4 bg-green-600">
            <a href="{% url 'food_menu:index' %}" class="text-5xl font-bold text-yellow-400">Crave<span class="text-orange-500 font-bold">.</span></a>
            <div class="hidden md:flex space-x-6 text-white">
            {% if user.is_authenticated %}
                <!-- <a href="http://">Menu</a>
                <a href="http://">Categories</a>
                <a href="http://">Orders</a>
                <a href="http://">Contact</a> -->
                <a href="{% url 'profile' %}">{{user.username}}</a>
                <a href="{% url 'logout' %}">Logout</a>
            {% else %}
                <a href="{% url 'login' %}">Login</a>
                <a href="{% url 'register' %}">Register</a>
            {% endif %}
            </div>

                <button class="md:hidden text-2xl my-5 text-white focus:outline-none" id="menu-toggle">
        ☰
    </button>
        </div>
    </nav>
        {% if messages%}
        <div class="container mx-auto p-4">
            {% for message in messages %}
                <div class="bg-blue-500 text-white p-4 rounded-md mb-4">
                    {{ message }}
                </div>
            {% endfor %}
        </div>
        {% endif %}

    {% block content %}
    {% endblock %}
</body>

</html>
