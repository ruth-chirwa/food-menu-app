{% extends 'food_menu/base.html' %}
{% load static %}

{% block content %}

<img src="{% static 'food_menu/images/hero_section.jpg' %}"
     alt="Food Menu"
     class="w-full h-80 object-cover">

<div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-8 p-10 items-stretch">

    {% for item in food_items %}

    <div class="bg-white rounded-xl shadow-md hover:shadow-xl transition duration-300 hover:-translate-y-1 overflow-hidden">

        <img src="{{ item.image }}"
             alt="{{ item.description }}"
             class="w-full h-56 object-cover">

        <div class="p-5">

            <h1 class="text-2xl font-bold">
                <a href="{% url 'food_menu:detail' item.id %}">
                    {{ item.name }}
                </a>
            </h1>

            <p class="text-gray-600 mt-2">
                {{ item.description }}
            </p>

            <p class="text-green-600 font-bold mt-3">
                MWK{{ item.price|floatformat:2 }}
            </p>

            <a href="{% url 'food_menu:detail' item.id %}"
               class="inline-block mt-5 bg-green-500 hover:bg-green-700 text-white font-bold py-2 px-4 rounded transition duration-300">
                View Details
            </a>

        </div>

    </div>

    {% endfor %}

</div>

{% endblock %}
