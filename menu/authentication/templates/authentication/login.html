{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
</head>
<body>

    <form method="post" class="max-w-md mx-auto mt-10 p-6 bg-gray-200 rounded-lg shadow-md">
        {% csrf_token %}
        <h2 class="text-4xl items-center justify-center flex font-bold mb-4">Login</h2>
        {{ form }}
        <button type="submit" class="bg-blue-500 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded">Login</button>
    </form>
    
</body>
</html>
